
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    color:#333;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#0077cc;
}

nav h2{
    color:white;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

nav a:hover{
    color:yellow;
}

section{
    padding:40px 20px;
    text-align:center;
}

.hero{
    background:#eaf4ff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    padding:15px;
}

.card img{
    width:100%;
    border-radius:10px;
}

input,
textarea{
    width:80%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 20px;
    background:#0077cc;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005fa3;
}

footer{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
</style>

</head>

<body>

<nav>

<h2>Team Portfolio</h2>

<div>

<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#projects">Projects</a>
<a href="#contact">Contact</a>

</div>

</nav>

<section id="home" class="hero">

<h1>Welcome to Team Portfolio</h1>

<p>HTML • CSS • JavaScript • Git & GitHub</p>

</section>

<section id="about">

<h2>About Us</h2>

<p>We build responsive and modern websites.</p>

</section>

<section id="projects">

<h2>Projects</h2>

<div class="grid">

<div class="card">

<img src="https://picsum.photos/300/180?1" alt="Weather">

<h3>Weather Dashboard</h3>

</div>

<div class="card">

<img src="https://picsum.photos/300/180?2" alt="Product">

<h3>Product Explorer</h3>

</div>

<div class="card">

<img src="https://picsum.photos/300/180?3" alt="Quote">

<h3>Quote Generator</h3>

</div>

</div>

</section>

<section id="contact">

<h2>Contact</h2>

<form id="contactForm">

<input
type="text"
id="name"
placeholder="Enter Name"
required>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<textarea
id="message"
placeholder="Enter Message"
required>
</textarea>

<br>

<button type="submit">
Send Message
</button>

</form>

</section>

<footer>

<p>© 2026 Team Portfolio | All Rights Reserved</p>

</footer>

<script>

const form = document.getElementById("contactForm");

form.addEventListener("submit", function(event){

    event.preventDefault();

    let name = document.getElementById("name").value;

    alert("Thank You " + name + "! Your message has been sent.");

    form.reset();

});

</script>

</body>
</html>
